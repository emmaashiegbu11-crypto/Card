<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Card</title><style>
body{font:16px sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f8fafc}
.card{background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 6px -1px #0002;max-width:300px;position:relative;transition:.2s}
.card:hover, .card:focus-within{transform:translateY(-4px);box-shadow:0 10px 15px -3px #0002}
.btn{position:absolute;top:1rem;right:1rem;border:none;background:0;cursor:pointer;padding:8px;border-radius:6px;transition:.2s}
.btn:hover{background:#fee2e2;color:#dc2626}
.btn:active{transform:scale(0.95)}
.btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;border-radius:8px;display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:.3s;overflow:hidden}
.toast.show{visibility:visible;opacity:1}
.toast-content{padding:.75rem 1.25rem;display:flex;align-items:center;gap:1rem}
.toast-undo{background:#38bdf8;color:#0f172a;border:none;padding:.25rem .75rem;border-radius:4px;font-weight:600;cursor:pointer;transition:.2s}
.toast-undo:active{transform:scale(0.95)}
.toast-progress{height:4px;background:#38bdf8;width:100%;transform-origin:left;transform:scaleX(0)}
.toast.show .toast-progress{animation:shrink 5s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.hidden{display:none}
.card.restored{animation:pulse 1s}@keyframes pulse{0%{box-shadow:0 0 0 4px #38bdf8}100%{box-shadow:0 4px 6px -1px #0002}}
</style></head><body>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<div class="card" id="card"><h3>Feature Card</h3><p>An accessible card demo.</p>
<button id="del" class="btn" aria-label="Delete Card (Del)" title="Delete Card">🗑️</button></div>
<div id="toast" class="toast" role="status"><div class="toast-content"><span>Card deleted</span>
<button id="undo" class="toast-undo" aria-label="Undo deletion (Esc)">Undo <small>(Esc)</small></button>
</div><div class="toast-progress"></div></div><script>
const card=document.getElementById('card'), del=document.getElementById('del'), toast=document.getElementById('toast'), undo=document.getElementById('undo'), announcer=document.getElementById('announcer');
let t;
del.onclick=()=>{
  card.classList.add('hidden'); toast.classList.add('show'); announcer.textContent='Card deleted';
  setTimeout(()=>undo.focus(),100);
  t=setTimeout(()=>{toast.classList.remove('show');announcer.textContent=''},5000);
};
undo.onclick=()=>{
  clearTimeout(t); card.classList.remove('hidden'); card.classList.add('restored');
  toast.classList.remove('show'); announcer.textContent='Card restored';
  setTimeout(()=>{card.classList.remove('restored');del.focus()},1000);
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&toast.classList.contains('show'))undo.click();
  if(e.key==='Delete'&&document.activeElement===del)del.click();
});
</script></body></html>
