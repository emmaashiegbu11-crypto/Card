<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Card</title><style>
body{font:16px sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f8fafc}
.card{background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 6px -1px #0002;max-width:300px;position:relative;transition:.2s}
.card:hover, .card:focus-within{transform:translateY(-4px);box-shadow:0 10px 15px -3px #0002}
.btn{position:absolute;top:1rem;right:1rem;border:none;background:0;cursor:pointer;padding:8px;border-radius:6px;transition:.2s}
.btn:hover{background:#fee2e2;color:#dc2626}
.btn:active{transform:scale(0.95)}
.btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;border-radius:8px;display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:.3s;overflow:hidden}
.toast.show{visibility:visible;opacity:1}
.toast-content{padding:.75rem 1.25rem;display:flex;align-items:center;gap:1rem}
.toast-undo{background:#38bdf8;color:#0f172a;border:none;padding:.25rem .75rem;border-radius:4px;font-weight:600;cursor:pointer;transition:.2s}
.toast-undo:hover{background:#7dd3fc}
.toast-undo:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
.toast-undo:active{transform:scale(0.95)}
.toast-progress{height:4px;background:#38bdf8;width:100%;transform-origin:left;transform:scaleX(0)}
.toast.show .toast-progress{animation:shrink 5s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.card.restored{animation:pulse 1s}@keyframes pulse{0%{box-shadow:0 0 0 4px #38bdf8}100%{box-shadow:0 4px 6px -1px #0002}}
#empty{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;min-height:100px}
#restore{background:#2563eb;color:#fff}
#restore:hover{background:#1d4ed8}
#restore:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.toast-close{background:none;border:none;color:#94a3b8;font-size:1.25rem;cursor:pointer;padding:4px;line-height:1;transition:.2s;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.toast-close:hover{color:#fff;background:#334155}
.toast-close:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
.toast-close:active{transform:scale(0.95)}
.shortcut-hint{opacity:0;max-width:0;display:inline-block;overflow:hidden;white-space:nowrap;transition:.3s;margin-left:0;font-size:.75rem;font-weight:normal;color:inherit;vertical-align:middle}
.btn:hover .shortcut-hint, .btn:focus-within .shortcut-hint, .toast-undo:hover .shortcut-hint, .toast-undo:focus-within .shortcut-hint, #restore:hover .shortcut-hint, #restore:focus-within .shortcut-hint{opacity:.8;max-width:60px;margin-left:4px}
.hidden{display:none!important}
</style></head><body>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<div class="card" id="card"><h3>Feature Card</h3><p>An accessible card demo.</p>
<button id="del" class="btn" aria-label="Delete Card (Delete)" title="Delete Card">🗑️<span class="shortcut-hint">(Delete)</span></button></div>
<div class="card hidden" id="empty"><h3>No Active Card</h3><p>Use the button below or press "R" to restore.</p>
<button id="restore" class="toast-undo" aria-label="Restore Card (R)" title="Restore Card">Restore Card <span class="shortcut-hint">(R)</span></button></div>
<div id="toast" class="toast" role="status"><div class="toast-content"><span>Card deleted</span>
<button id="undo" class="toast-undo" aria-label="Undo deletion (Esc)">Undo <small>(Esc)</small></button>
<button id="closeToast" class="toast-close" aria-label="Dismiss notification" title="Dismiss notification">×</button>
</div><div class="toast-progress"></div></div><script>
const card = document.getElementById('card');
const deleteBtn = document.getElementById('del');
const toast = document.getElementById('toast');
const undoBtn = document.getElementById('undo');
const announcer = document.getElementById('announcer');
const emptyState = document.getElementById('empty');
const restoreBtn = document.getElementById('restore');
const closeToastBtn = document.getElementById('closeToast');

let toastTimeout;
let startTime;
let remainingTime = 5000;
let isHovered = false;
let isFocused = false;

const startTimer = () => {
  if (toastTimeout) clearTimeout(toastTimeout);
  startTime = Date.now();
  toastTimeout = setTimeout(() => {
    console.log("Timer expired! Active element:", document.activeElement ? document.activeElement.id : "none");
    toast.classList.remove('show');
    announcer.textContent = '';
    console.log("Checking if activeElement is undoBtn:", document.activeElement === undoBtn);
    if (document.activeElement === undoBtn) {
      console.log("Focusing restoreBtn...");
      restoreBtn.focus();
      console.log("Active element after focus:", document.activeElement ? document.activeElement.id : "none");
    }
  }, remainingTime);
  toast.querySelector('.toast-progress').style.animationPlayState = 'running';
};

const pauseTimer = () => {
  if (toastTimeout) {
    clearTimeout(toastTimeout);
    toastTimeout = null;
    remainingTime -= (Date.now() - startTime);
    toast.querySelector('.toast-progress').style.animationPlayState = 'paused';
  }
};

const resetTimer = () => {
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = null;
  remainingTime = 5000;
  isHovered = false;
  isFocused = false;
};

deleteBtn.onclick = () => {
  card.classList.add('hidden');
  emptyState.classList.remove('hidden');
  toast.classList.add('show');
  announcer.textContent = 'Card deleted';
  setTimeout(() => undoBtn.focus(), 100);
  resetTimer();
  startTimer();
};

undoBtn.onclick = () => {
  resetTimer();
  card.classList.remove('hidden');
  card.classList.add('restored');
  emptyState.classList.add('hidden');
  toast.classList.remove('show');
  announcer.textContent = 'Card restored';
  setTimeout(() => {
    card.classList.remove('restored');
    deleteBtn.focus();
  }, 1000);
};

restoreBtn.onclick = () => {
  resetTimer();
  card.classList.remove('hidden');
  card.classList.add('restored');
  emptyState.classList.add('hidden');
  toast.classList.remove('show');
  announcer.textContent = 'Card restored';
  setTimeout(() => {
    card.classList.remove('restored');
    deleteBtn.focus();
  }, 1000);
};

closeToastBtn.onclick = () => {
  resetTimer();
  toast.classList.remove('show');
  announcer.textContent = 'Notification dismissed';
  if (toast.contains(document.activeElement)) {
    restoreBtn.focus();
  }
};

toast.addEventListener('mouseenter', () => {
  isHovered = true;
  pauseTimer();
});

toast.addEventListener('mouseleave', () => {
  isHovered = false;
  if (!isFocused) startTimer();
});

toast.addEventListener('focusin', () => {
  isFocused = true;
  pauseTimer();
});

toast.addEventListener('focusout', () => {
  isFocused = false;
  if (!isHovered) startTimer();
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && toast.classList.contains('show')) {
    undoBtn.click();
  }
  if (event.key === 'Delete' && document.activeElement === deleteBtn) {
    deleteBtn.click();
  }
  if ((event.key === 'r' || event.key === 'R') && !emptyState.classList.contains('hidden')) {
    restoreBtn.click();
  }
});
</script></body></html>
