<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Card</title>
  <style>
    body{font:16px sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f8fafc}
    .card{background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 6px -1px #0002;max-width:300px;position:relative;transition:.2s}
    .card:hover{transform:translateY(-4px);box-shadow:0 10px 15px -3px #0002}
    .btn{position:absolute;top:1rem;right:1rem;border:none;background:0;cursor:pointer;padding:8px;border-radius:6px;transition:.2s}
    .btn:hover{background:#fee2e2;color:#dc2626}
    .btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
    .card.removing{opacity:0;transform:scale(0.95);pointer-events:none}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:.75rem 1.25rem;border-radius:8px;display:flex;align-items:center;gap:1rem;box-shadow:0 10px 15px -3px #0004;visibility:hidden;opacity:0;transition:.3s}
    .toast.show{visibility:visible;opacity:1}
    .toast-undo{background:#38bdf8;color:#0f172a;border:none;padding:.25rem .75rem;border-radius:4px;font-weight:600;cursor:pointer;transition:.2s}
    .toast-undo:hover{background:#7dd3fc}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <h3>Feature Card</h3>
    <p>An accessible card demo.</p>
    <button id="delBtn" class="btn" aria-label="Delete card" title="Delete card">
      <span aria-hidden="true">🗑️</span>
    </button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastMsg"></span>
    <button id="undo" class="toast-undo">Undo</button>
  </div>
  <div class="sr-only" aria-live="assertive" id="liveAnnouncer"></div>
  <script>
    const card = document.getElementById('mainCard');
    const delBtn = document.getElementById('delBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const undoBtn = document.getElementById('undo');
    const liveAnnouncer = document.getElementById('liveAnnouncer');
    let timeout;

    delBtn.onclick = () => {
      card.classList.add('removing');
      toastMsg.textContent = 'Card deleted';
      toast.classList.add('show');
      liveAnnouncer.textContent = 'Card deleted. Press Undo to restore.';
      setTimeout(() => undoBtn.focus(), 50);
      timeout = setTimeout(() => {
        card.style.display = 'none';
        toast.classList.remove('show');
      }, 5000);
    };

    undoBtn.onclick = () => {
      clearTimeout(timeout);
      card.classList.remove('removing');
      card.style.display = 'block';
      toast.classList.remove('show');
      liveAnnouncer.textContent = 'Action undone. Card restored.';
      delBtn.focus();
    };
  </script>
</body>
</html>
