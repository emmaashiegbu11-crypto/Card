<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Accessible Card</title><style>
  body{font:16px sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f8fafc}
  .card{background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 6px -1px #0002;position:relative;transition:.2s}
  .card:hover,.card:focus-within{transform:translateY(-4px);box-shadow:0 10px 15px -3px #0002}
  .btn{border:none;background:#fee2e2;color:#dc2626;cursor:pointer;padding:8px;border-radius:6px;font-weight:600}
  .btn:active{transform:scale(0.95)}
  .toast{position:fixed;bottom:2rem;background:#1e293b;color:#fff;padding:.75rem 1.25rem;border-radius:8px;display:flex;align-items:center;gap:1rem;visibility:hidden;opacity:0;transition:.3s}
  .toast.show{visibility:visible;opacity:1}
  .undo{background:#38bdf8;color:#0f172a;border:none;padding:.25rem .75rem;border-radius:4px;cursor:pointer;font-weight:600}
  .hidden{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style></head><body>
<div class="card" id="mainCard"><h3>Feature Card</h3><button id="delBtn" class="btn" aria-label="Delete Card (Del)">Delete <small aria-hidden="true">(Del)</small></button></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
  const card=document.getElementById('mainCard'), delBtn=document.getElementById('delBtn'), toast=document.getElementById('toast'); let timer;
  delBtn.onclick=()=>{
    card.classList.add('hidden'); toast.innerHTML='Card deleted <button id="undoBtn" class="undo">Undo <small aria-hidden="true">(Esc)</small></button>';
    toast.classList.add('show'); const undoBtn=document.getElementById('undoBtn'); undoBtn.focus();
    undoBtn.onclick=()=>{clearTimeout(timer); card.classList.remove('hidden'); toast.classList.remove('show'); toast.innerHTML=''; delBtn.focus();};
    timer=setTimeout(()=>{toast.classList.remove('show'); toast.innerHTML='';}, 5000);
  };
  document.onkeydown=(e)=>{
    if(e.key==='Delete'&&document.activeElement===delBtn) delBtn.click();
    if(e.key==='Escape'&&document.getElementById('undoBtn')) document.getElementById('undoBtn').click();
  };
</script></body></html>
