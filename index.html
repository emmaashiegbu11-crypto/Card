<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Card</title>
  <style>
    body{font:16px sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f8fafc}
    .card{background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 6px -1px #0002;max-width:300px;position:relative;transition:.2s}
    .card:hover{transform:translateY(-4px);box-shadow:0 10px 15px -3px #0002}
    .btn{position:absolute;top:1rem;right:1rem;border:none;background:0;cursor:pointer;padding:8px;border-radius:6px;transition:.2s}
    .btn:hover{background:#fee2e2;color:#dc2626}
    .btn:active{transform:scale(0.95)}
    .btn:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none}
    .btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .card.removing{opacity:0;transform:scale(0.95);pointer-events:none}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;border-radius:8px;display:flex;flex-direction:column;box-shadow:0 10px 15px -3px #0004;visibility:hidden;opacity:0;transition:.3s;overflow:hidden}
    .toast.show{visibility:visible;opacity:1}
    .toast-content{padding:.75rem 1.25rem;display:flex;align-items:center;gap:1rem}
    .toast-undo{background:#38bdf8;color:#0f172a;border:none;padding:.25rem .75rem;border-radius:4px;font-weight:600;cursor:pointer;transition:.2s}
    .toast-undo:hover{background:#7dd3fc}
    .toast-undo:active{transform:scale(0.95)}
    .toast-undo:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
    .toast-progress{height:4px;background:#38bdf8;width:100%;transform-origin:left;transform:scaleX(0)}
    .toast.show .toast-progress{animation:shrink 5s linear forwards}
    @keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <h3>Feature Card</h3>
    <p>An accessible card demo.</p>
    <button id="delBtn" class="btn" aria-label="Delete Feature Card" title="Delete card">
      <span aria-hidden="true">🗑️</span>
    </button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="toast-content">
      <span id="toastMsg"></span>
      <button id="undo" class="toast-undo" aria-label="Undo (or press Escape)" title="Press Escape to undo">Undo</button>
    </div>
    <div class="toast-progress"></div>
  </div>
  <script>
    const card = document.getElementById('mainCard');
    const delBtn = document.getElementById('delBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const undoBtn = document.getElementById('undo');
    let timeout;

    delBtn.onclick = () => {
      card.classList.add('removing');
      card.setAttribute('aria-hidden', 'true');
      card.setAttribute('tabindex', '-1');
      delBtn.disabled = true;
      toastMsg.textContent = 'Card deleted';
      toast.classList.add('show');
      setTimeout(() => undoBtn.focus(), 50);
      timeout = setTimeout(() => {
        card.style.display = 'none';
        toast.classList.remove('show');
      }, 5000);
    };

    undoBtn.onclick = () => {
      clearTimeout(timeout);
      card.classList.remove('removing');
      card.removeAttribute('aria-hidden');
      card.removeAttribute('tabindex');
      card.style.display = 'block';
      delBtn.disabled = false;
      toastMsg.textContent = 'Card restored';
      toast.classList.remove('show');
      setTimeout(() => delBtn.focus(), 50);
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && toast.classList.contains('show')) {
        undoBtn.click();
      }
    });
  </script>
</body>
</html>
