<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Card</title>
  <style>
    body { font: 14px system-ui, sans-serif; display: grid; place-items: center; height: 95vh; background: #f8fafc; margin: 0; }
    .card, .toast { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px #0002; position: relative; transition: .2s; width: 280px; }
    .card:hover, .card:focus-within { transform: translateY(-4px); box-shadow: 0 10px 15px -3px #0002; }
    button { cursor: pointer; border: none; border-radius: 6px; transition: .2s; font-weight: 600; padding: .25rem .75rem; display: inline-flex; align-items: center; gap: 4px; }
    button:active { transform: scale(.95); } button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    .del-btn { position: absolute; top: 1rem; right: 1rem; background: none; padding: 6px; } .del-btn:hover, .del-btn:focus-visible { background: #fee2e2; }
    .toast { position: fixed; bottom: 2rem; background: #1e293b; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px; opacity: 0; visibility: hidden; transform: translateY(10px); transition: .2s; width: 320px; min-width: 320px; }
    .toast.show { opacity: 1; visibility: visible; transform: none; }
    .toast button:focus-visible { outline: 2px solid #38bdf8; }
    .undo-btn { background: #38bdf8; color: #0f172a; } .undo-btn:hover { background: #7dd3fc; }
    .close-btn { background: transparent; color: #94a3b8; font-size: 1.1rem; padding: 2px 6px; } .close-btn:hover { color: #fff; background: #334155; }
    .restore-btn { background: #2563eb; color: #fff; padding: .5rem 1.25rem; } .restore-btn:hover { background: #1d4ed8; }
    .hidden { display: none !important; } .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 4px #38bdf8; } 100% { box-shadow: 0 4px 6px -1px #0002; } } .restored { animation: pulse 1s ease-out; }
    .hint { opacity: 0; max-width: 0; overflow: hidden; transition: .2s; font-size: 11px; font-weight: 400; color: #64748b; }
    button:hover .hint, button:focus-within .hint { opacity: 1; max-width: 100px; margin-left: 4px; }
    .toast .hint { color: #cbd5e1; }
    .progress-bar { position: absolute; bottom: 0; left: 0; height: 4px; background: #38bdf8; width: 100%; transform-origin: left; }
  </style>
</head>
<body>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <div id="card" class="card" tabindex="0" aria-label="Interactive Card">
    <h3>Card Title</h3><p>An accessible card demo with rich interaction.</p>
    <button id="delBtn" class="del-btn" aria-label="Delete Card (Del)">🗑️<span class="hint">(Del)</span></button>
  </div>
  <button id="restoreBtn" class="restore-btn hidden" aria-label="Restore Card (R)">Restore Card<span class="hint">(R)</span></button>
  <div id="toast" class="toast" role="status">
    <div id="progress" class="progress-bar"></div>
    <span>Card deleted.</span>
    <div style="display:flex;gap:6px;align-items:center;">
      <button id="undoBtn" class="undo-btn" aria-label="Undo deletion (Esc)">Undo<span class="hint">(Esc)</span></button>
      <button id="closeBtn" class="close-btn" aria-label="Dismiss Notification (X)">×</button>
    </div>
  </div>
  <script>
    const card=document.getElementById('card'), delBtn=document.getElementById('delBtn'), restoreBtn=document.getElementById('restoreBtn'), toast=document.getElementById('toast'), undoBtn=document.getElementById('undoBtn'), closeBtn=document.getElementById('closeBtn'), progress=document.getElementById('progress'), ann=document.getElementById('announcer');
    let timer, startT, rem=5000, paused=0, hover=0, focus=0;
    const hide = () => { card.classList.add('hidden'); restoreBtn.classList.remove('hidden'); toast.classList.remove('show'); progress.style.animation='none'; setTimeout(()=>restoreBtn.focus(), 100); };
    const start = () => { if (rem > 0) { startT = Date.now(); paused = 0; timer = setTimeout(hide, rem); } };
    const pause = () => { if (!paused) { paused = 1; clearTimeout(timer); rem -= Date.now() - startT; progress.style.animationPlayState = 'paused'; } };
    const resume = () => { if (paused && !hover && !focus) { start(); progress.style.animationPlayState = 'running'; } };
    const restore = () => { card.classList.remove('hidden'); card.classList.add('restored'); setTimeout(()=>delBtn.focus(), 120); ann.textContent="Card restored"; setTimeout(()=>card.classList.remove('restored'), 1000); };
    delBtn.addEventListener('click', () => { card.classList.add('hidden'); toast.classList.add('show'); progress.style.animation = 'shrink 5s linear forwards'; progress.style.animationPlayState = 'running'; setTimeout(()=>undoBtn.focus(), 120); rem=5000; start(); ann.textContent="Card deleted"; });
    const cancelToast = () => { clearTimeout(timer); toast.classList.remove('show'); progress.style.animation = 'none'; };
    undoBtn.addEventListener('click', () => { cancelToast(); restore(); });
    closeBtn.addEventListener('click', () => { const hadFocus = toast.contains(document.activeElement); cancelToast(); hide(); if (hadFocus) setTimeout(()=>restoreBtn.focus(), 120); });
    restoreBtn.addEventListener('click', () => { restoreBtn.classList.add('hidden'); restore(); });
    toast.addEventListener('mouseenter', () => { hover = 1; pause(); }); toast.addEventListener('mouseleave', () => { hover = 0; resume(); });
    toast.addEventListener('focusin', () => { focus = 1; pause(); }); toast.addEventListener('focusout', e => { if (!toast.contains(e.relatedTarget)) { focus = 0; resume(); } });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && toast.classList.contains('show')) { e.preventDefault(); const hadFocus=toast.contains(document.activeElement); cancelToast(); hide(); if (hadFocus) setTimeout(()=>restoreBtn.focus(), 120); }
      if ((e.key === 'r' || e.key === 'R') && !restoreBtn.classList.contains('hidden')) restoreBtn.click();
      if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement === card) delBtn.click();
    });
  </script>
</body>
</html>
