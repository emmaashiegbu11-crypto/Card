<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Card Component</title>
<style>
  body { font: 16px sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #f8fafc; }
  .card, .empty { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px #0002; max-width: 300px; position: relative; transition: .2s; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .card:hover, .card:focus-within { transform: translateY(-4px); box-shadow: 0 10px 15px -3px #0002; }
  .btn { position: absolute; top: 1rem; right: 1rem; border: none; background: 0; cursor: pointer; padding: 8px; border-radius: 6px; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .btn:hover { background: #fee2e2; color: #dc2626; }
  .btn:active, .undo:active, .reset-btn:active { transform: scale(0.95); }
  .btn:focus-visible, .reset-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  .undo:focus-visible, .dismiss-btn:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; border-radius: 8px; display: flex; flex-direction: column; visibility: hidden; opacity: 0; transition: .3s; overflow: hidden; min-width: 250px; }
  .toast.show { visibility: visible; opacity: 1; }
  .toast-content { padding: .75rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
  .undo { background: #38bdf8; color: #0f172a; border: none; padding: .25rem .75rem; border-radius: 4px; font-weight: 600; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; gap: 4px; }
  .undo:disabled { opacity: 0.5; cursor: not-allowed; }
  .toast-progress { height: 4px; background: #38bdf8; width: 100%; transform-origin: left; transform: scaleX(0); }
  .toast.show .toast-progress { animation: shrink 5s linear forwards; }
  .toast.paused .toast-progress { animation-play-state: paused; }
  @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .hidden { display: none !important; }
  .card.restored { animation: pulse 1s; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 4px #38bdf8; } 100% { box-shadow: 0 4px 6px -1px #0002; } }
  .reset-btn { margin-top: 1rem; background: #2563eb; color: #fff; border: none; padding: .5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; gap: 4px; }
  .dismiss-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; transition: .2s; margin-left: auto; }
  .dismiss-btn:hover { color: #fff; background: #334155; }
  .dismiss-btn:active { transform: scale(0.95); }
  .undo:hover:not(:disabled) { background: #7dd3fc; }
  .reset-btn:hover { background: #1d4ed8; }
  .shortcut-hint { opacity: 0; font-size: 0.75rem; font-weight: normal; color: #64748b; transition: opacity 0.2s, max-width 0.2s, margin 0.2s; max-width: 0; overflow: hidden; white-space: nowrap; display: inline-block; }
  .btn:hover .shortcut-hint, .btn:focus-within .shortcut-hint,
  .undo:hover .shortcut-hint, .undo:focus-within .shortcut-hint,
  .reset-btn:hover .shortcut-hint, .reset-btn:focus-within .shortcut-hint { opacity: 1; max-width: 50px; margin-left: 4px; }
</style></head><body>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<div class="card" id="card">
  <h3>Feature Card</h3><p>An accessible card demo.</p>
  <button id="delBtn" class="btn" aria-label="Delete Feature Card (Del)" title="Delete Feature Card"><span aria-hidden="true">🗑️</span><span class="shortcut-hint">(Del)</span></button>
</div>
<div class="empty hidden" id="empty">
  <h3>No Cards Left</h3><p>The card was permanently deleted.</p>
  <button id="resBtn" class="reset-btn" aria-label="Restore Card (R)">Restore <small class="shortcut-hint">(R)</small></button>
</div>
<div id="toast" class="toast" role="status">
  <div class="toast-content"><span>Card deleted</span>
    <button id="undoBtn" class="undo" aria-label="Undo deletion (Esc)" disabled>Undo <small class="shortcut-hint">(Esc)</small></button>
    <button id="dismissBtn" class="dismiss-btn" aria-label="Dismiss notification" title="Dismiss notification">✕</button>
  </div><div class="toast-progress"></div>
</div>
<script>
  const card = document.getElementById('card'), delBtn = document.getElementById('delBtn'), toast = document.getElementById('toast'), undoBtn = document.getElementById('undoBtn'), empty = document.getElementById('empty'), resBtn = document.getElementById('resBtn'), announcer = document.getElementById('announcer'), dismissBtn = document.getElementById('dismissBtn');
  let toastTimer, focusTimer, startTime, remainingTime = 5000, isPaused = false;
  const clearTimers = () => { clearTimeout(toastTimer); clearTimeout(focusTimer); };
  const restoreCard = () => {
    clearTimers(); undoBtn.disabled = true; card.classList.remove('hidden'); card.classList.add('restored'); toast.classList.remove('show'); toast.classList.remove('paused'); isPaused = false;
    announcer.textContent = 'Card restored'; focusTimer = setTimeout(() => { card.classList.remove('restored'); delBtn.focus(); }, 1000);
  };
  const dismissToast = () => {
    const isToastFocused = toast.contains(document.activeElement);
    clearTimers();
    toast.classList.remove('show'); toast.classList.remove('paused'); undoBtn.disabled = true; empty.classList.remove('hidden'); announcer.textContent = 'Card permanently deleted';
    if (isToastFocused) focusTimer = setTimeout(() => resBtn.focus(), 100);
  };
  const startToastTimer = (duration) => {
    startTime = Date.now();
    toastTimer = setTimeout(dismissToast, duration);
  };
  const pauseToast = () => {
    if (isPaused || !toast.classList.contains('show')) return;
    isPaused = true; toast.classList.add('paused'); clearTimers();
    remainingTime -= (Date.now() - startTime);
  };
  const resumeToast = () => {
    if (!isPaused || !toast.classList.contains('show')) return;
    isPaused = false; toast.classList.remove('paused');
    startToastTimer(Math.max(remainingTime, 0));
  };
  delBtn.addEventListener('click', () => {
    clearTimers(); empty.classList.add('hidden'); undoBtn.disabled = false; card.classList.add('hidden'); toast.classList.add('show'); toast.classList.remove('paused');
    announcer.textContent = 'Card deleted'; focusTimer = setTimeout(() => undoBtn.focus(), 100);
    remainingTime = 5000; isPaused = false;
    startToastTimer(remainingTime);
  });
  undoBtn.addEventListener('click', restoreCard);
  dismissBtn.addEventListener('click', dismissToast);
  resBtn.addEventListener('click', () => { empty.classList.add('hidden'); restoreCard(); });
  toast.addEventListener('mouseenter', pauseToast);
  toast.addEventListener('mouseleave', resumeToast);
  toast.addEventListener('focusin', pauseToast);
  toast.addEventListener('focusout', (e) => {
    if (!toast.contains(e.relatedTarget)) resumeToast();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && toast.classList.contains('show')) { e.preventDefault(); undoBtn.click(); }
    if (e.key === 'Delete' && document.activeElement === delBtn) { e.preventDefault(); delBtn.click(); }
    if ((e.key === 'r' || e.key === 'R') && !empty.classList.contains('hidden') && document.activeElement !== delBtn) { e.preventDefault(); resBtn.click(); }
  });
</script></body></html>
